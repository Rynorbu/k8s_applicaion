{{- with .Values.observability.otelCollector }}{{- if .enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-otel-collector
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
data:
  config.yaml: |-
{{ ($.Files.Get "files/otel-collector.yaml") | replace "jaeger:4317" "spendwise-jaeger:4317" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-otel-collector
  labels:
    {{- include "spendwise.labels" $ | nindent 4 }}
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector }
  template:
    metadata:
      labels:
        {{- include "spendwise.labels" $ | nindent 8 }}
        app.kubernetes.io/name: otel-collector
      annotations:
        checksum/config: {{ $.Files.Get "files/otel-collector.yaml" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: {{ .image }}
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, runAsNonRoot: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: config, mountPath: /etc/otelcol }]
      volumes: [{ name: config, configMap: { name: spendwise-otel-collector } }]
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-otel-collector
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
{{- end }}{{- end }}
{{- with .Values.observability.jaeger }}{{- if .enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-jaeger
  labels:
    {{- include "spendwise.labels" $ | nindent 4 }}
    app.kubernetes.io/name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jaeger }
  template:
    metadata:
      labels:
        {{- include "spendwise.labels" $ | nindent 8 }}
        app.kubernetes.io/name: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: {{ .image }}
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-jaeger
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
{{- end }}{{- end }}
{{- with .Values.observability.prometheus }}{{- if .enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spendwise-prometheus
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spendwise-prometheus
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spendwise-prometheus
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: spendwise-prometheus }
subjects: [{ kind: ServiceAccount, name: spendwise-prometheus, namespace: {{ $.Release.Namespace }} }]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-prometheus
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
data:
  prometheus.yml: |
    global: { scrape_interval: 15s, evaluation_interval: 15s }
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: spendwise
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [{{ $.Release.Namespace }}] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([^:]+)(?::\d+)?;(\d+)'
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
  alerts.yml: |-
{{ $.Files.Get "files/alerts.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-prometheus
  labels:
    {{- include "spendwise.labels" $ | nindent 4 }}
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels:
        {{- include "spendwise.labels" $ | nindent 8 }}
        app.kubernetes.io/name: prometheus
    spec:
      serviceAccountName: spendwise-prometheus
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534 }
      containers:
        - name: prometheus
          image: {{ .image }}
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--storage.tsdb.retention.time={{ .retention }}"]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: spendwise-prometheus } }
        - name: data
          persistentVolumeClaim: { claimName: spendwise-prometheus-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spendwise-prometheus-data
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: {{ .storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-prometheus
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
{{- end }}{{- end }}
{{- with .Values.observability.grafana }}{{- if .enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-grafana-provisioning
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, url: "http://spendwise-prometheus:9090", isDefault: true }
      - { name: Jaeger, uid: jaeger, type: jaeger, access: proxy, url: "http://spendwise-jaeger:16686" }
  dashboards.yml: |
    apiVersion: 1
    providers:
      - { name: spendwise, folder: SpendWise, type: file, options: { path: /var/lib/grafana/dashboards } }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-grafana-dashboards
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
data:
  spendwise-overview.json: |-
{{ $.Files.Get "files/grafana/spendwise-overview.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spendwise-grafana
  labels:
    {{- include "spendwise.labels" $ | nindent 4 }}
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: grafana }
  template:
    metadata:
      labels:
        {{- include "spendwise.labels" $ | nindent 8 }}
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472 }
      containers:
        - name: grafana
          image: {{ .image }}
          env:
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: {{ .adminPassword | quote }} }
            - { name: GF_PATHS_PROVISIONING, value: /etc/grafana/provisioning }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /api/health, port: http } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: provisioning, configMap: { name: spendwise-grafana-provisioning } }
        - { name: dashboards, configMap: { name: spendwise-grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata:
  name: spendwise-grafana
  labels: {{- include "spendwise.labels" $ | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- end }}{{- end }}
