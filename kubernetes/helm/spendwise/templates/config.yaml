apiVersion: v1
kind: ConfigMap
metadata:
  name: spendwise-config
  labels: {{- include "spendwise.labels" . | nindent 4 }}
data:
  NODE_ENV: production
  LOG_LEVEL: {{ .Values.global.logLevel | quote }}
  ENABLE_DOCS: {{ .Values.config.enableDocs | quote }}
  APP_URL: {{ .Values.global.appUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  ADMIN_EMAILS: {{ .Values.config.adminEmails | quote }}
  COOKIE_SECURE: {{ .Values.config.cookieSecure | quote }}
  RATES_REFRESH_ENABLED: {{ .Values.config.ratesRefreshEnabled | quote }}
  AUTH_JWKS_URL: http://auth-service:4001/.well-known/jwks.json
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.endpoints.otelCollector | quote }}
  SMTP_HOST: {{ .Values.endpoints.smtpHost | quote }}
  SMTP_PORT: {{ .Values.endpoints.smtpPort | quote }}
  SMTP_USER: {{ .Values.endpoints.smtpUser | quote }}
  EMAIL_FROM: {{ .Values.endpoints.emailFrom | quote }}
  {{- range $name, $svc := .Values.services }}
  {{ $name | replace "-service" "" | replace "api-gateway" "gateway" | upper | replace "-" "_" }}_SERVICE_URL: http://{{ $name }}:{{ $svc.port }}
  {{- end }}
---
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: spendwise-secrets
  labels: {{- include "spendwise.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  internal-api-token: {{ .Values.secrets.values.internalApiToken | quote }}
  jwt-private-key: {{ .Values.secrets.values.jwtPrivateKey | quote }}
  service-db-password: {{ .Values.secrets.values.serviceDbPassword | quote }}
  postgres-password: {{ .Values.secrets.values.postgresPassword | quote }}
  rabbitmq-user: {{ .Values.secrets.values.rabbitmqUser | quote }}
  rabbitmq-password: {{ .Values.secrets.values.rabbitmqPassword | quote }}
  redis-password: {{ .Values.secrets.values.redisPassword | quote }}
  anthropic-api-key: {{ .Values.secrets.values.anthropicApiKey | quote }}
  smtp-password: {{ .Values.secrets.values.smtpPassword | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spendwise
  labels: {{- include "spendwise.labels" . | nindent 4 }}
automountServiceAccountToken: false
