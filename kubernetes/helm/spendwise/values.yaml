# Default values for the SpendWise chart. Environment overlays: values-dev.yaml, values-prod.yaml.

global:
  environment: production
  logLevel: info
  appUrl: https://spendwise.example.com

image:
  registry: ghcr.io/your-org/spendwise
  tag: latest            # CI/CD (GitOps) pins this to the commit SHA
  pullPolicy: IfNotPresent
  pullSecrets: []

# Secrets. For real environments set create=false and provide `existingSecret`
# (e.g. via Sealed Secrets or External Secrets Operator). Keys expected:
#   internal-api-token, jwt-private-key, service-db-password, postgres-password,
#   rabbitmq-user, rabbitmq-password, redis-password, anthropic-api-key, smtp-password
secrets:
  create: true
  existingSecret: ""
  values:
    internalApiToken: change-me-internal-token-0123456789abcdef
    jwtPrivateKey: ""          # base64 PKCS#8 PEM (npm run secrets:generate)
    serviceDbPassword: change-me-db
    postgresPassword: change-me-postgres
    rabbitmqUser: spendwise
    rabbitmqPassword: change-me-rabbit
    redisPassword: change-me-redis
    anthropicApiKey: ""
    smtpPassword: ""

# Connection endpoints (defaults point at the in-cluster infrastructure below).
endpoints:
  postgresHost: spendwise-postgres
  postgresPort: 5432
  rabbitmqHost: spendwise-rabbitmq
  redisHost: spendwise-redis
  otelCollector: http://spendwise-otel-collector:4318
  smtpHost: spendwise-mailpit
  smtpPort: 1025
  smtpUser: ""
  emailFrom: "SpendWise <no-reply@spendwise.example.com>"

config:
  corsOrigins: https://spendwise.example.com
  adminEmails: ""
  cookieSecure: "true"
  ratesRefreshEnabled: "true"
  enableDocs: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: { type: RuntimeDefault }

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: { drop: [ALL] }

defaults:
  replicas: 2
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 384Mi }
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  pdb:
    minAvailable: 1

# The 17 microservices. `database` = owned PostgreSQL database (database-per-service).
services:
  api-gateway:      { port: 8080 }
  auth-service:     { port: 4001, database: auth }
  user-service:     { port: 4002, database: users }
  expense-service:  { port: 4003, database: expenses, hpa: { maxReplicas: 10 } }
  income-service:   { port: 4004, database: incomes }
  category-service: { port: 4005, database: categories }
  budget-service:   { port: 4006, database: budgets }
  recurring-service: { port: 4007, database: recurring }
  goal-service:     { port: 4008, database: goals }
  analytics-service: { port: 4009, database: analytics, hpa: { maxReplicas: 8 } }
  notification-service: { port: 4010, database: notifications }
  report-service:
    port: 4011
    database: reports
    replicas: 1
    hpa: { enabled: false }
    storage: { size: 5Gi, mountPath: /data/reports, env: REPORTS_DIR }
    resources: { requests: { cpu: 100m, memory: 192Mi }, limits: { cpu: "1", memory: 768Mi } }
  search-service:   { port: 4012, database: search }
  currency-service: { port: 4013, database: currency }
  audit-service:    { port: 4014, database: audit }
  ai-service:       { port: 4015, database: ai }
  file-service:
    port: 4016
    database: files
    replicas: 1
    hpa: { enabled: false }
    storage: { size: 10Gi, mountPath: /data/files, env: FILES_DIR }

frontend:
  enabled: true
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  hpa: { enabled: true, minReplicas: 2, maxReplicas: 5, targetCPUUtilization: 70 }

ingress:
  enabled: true
  className: nginx
  host: spendwise.example.com
  tls:
    enabled: true
    secretName: spendwise-tls
    clusterIssuer: letsencrypt-prod   # cert-manager
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 6m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "50"

networkPolicy:
  enabled: true
  ingressControllerNamespace: ingress-nginx

storageClass: ""   # empty = cluster default

# In-cluster infrastructure. For production prefer managed services or operators
# (CloudNativePG, RabbitMQ Cluster Operator, Redis operator) and disable these.
infrastructure:
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 20Gi
    resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
  rabbitmq:
    enabled: true
    image: rabbitmq:3.13-management-alpine
    storage: 5Gi
    resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
  redis:
    enabled: true
    image: redis:7-alpine
    resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 320Mi } }
  mailpit:
    enabled: true
    image: axllent/mailpit:v1.21

observability:
  otelCollector: { enabled: true, image: otel/opentelemetry-collector-contrib:0.116.1 }
  jaeger: { enabled: true, image: jaegertracing/all-in-one:1.64.0 }
  prometheus: { enabled: true, image: prom/prometheus:v3.1.0, retention: 7d, storage: 10Gi }
  grafana: { enabled: true, image: grafana/grafana:11.4.0, adminPassword: change-me-grafana }
