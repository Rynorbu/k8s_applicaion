# App-of-apps: apply this once (kubectl apply -n argocd -f kubernetes/argocd/root-app.yaml)
# and Argo CD manages the project and both environment applications from Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spendwise-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/spendwise.git
    targetRevision: main
    path: kubernetes/argocd
    directory:
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
