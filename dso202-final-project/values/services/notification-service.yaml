# notification-service - values for the shared chart charts/microservice (one file per service).
# Argo CD's ApplicationSet creates one Application named "notification-service" from this file.
image:
  repository: spendwise/notification-service
  tag: dev
port: 4010
database: "notifications"
replicaCount: 1
secretEnv:
  - { name: SMTP_PASSWORD, key: smtp-password, optional: true }
