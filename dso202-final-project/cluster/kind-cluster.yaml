# DSO202 Final Project - local Kubernetes cluster for SpendWise.
# 1 control-plane + 2 workers (same layout as the practicals).
#
#   kind create cluster --config cluster/kind-cluster.yaml
#
# The control-plane runs the NGINX Ingress controller, so its ports 80/443 are mapped
# to the host. Host ports 8000/8443 are used because 80/443 are often already taken
# by another kind cluster; change hostPort to 80/443 if they are free on your machine.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: spendwise
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8000
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      spendwise/node-index: "1"
  - role: worker
    labels:
      spendwise/node-index: "2"
