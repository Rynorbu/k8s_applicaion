# ApplicationSet: ONE template -> one Argo CD Application per file in values/services/.
# Adding a 19th service = adding one values file to Git. Each service syncs, rolls back
# and reports health independently, but they all use the same chart.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: spendwise-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/YOUR-GITHUB-USERNAME/spendwise.git
        revision: main
        files:
          - path: dso202-final-project/values/services/*.yaml
  template:
    metadata:
      name: '{{ trimSuffix ".yaml" .path.filename }}'
      labels:
        app.kubernetes.io/part-of: spendwise
        spendwise/tier: microservice
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: spendwise
      source:
        repoURL: https://github.com/YOUR-GITHUB-USERNAME/spendwise.git
        targetRevision: main
        path: dso202-final-project/charts/microservice
        helm:
          releaseName: '{{ trimSuffix ".yaml" .path.filename }}'
          valueFiles:
            - '../../values/services/{{ .path.filename }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: spendwise
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 10
          backoff: { duration: 15s, factor: 2, maxDuration: 3m }
