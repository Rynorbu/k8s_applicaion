{{- /* One ConfigMap per dashboard; Grafana's sidecar loads every ConfigMap labelled grafana_dashboard=1. */ -}}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: spendwise
  annotations:
    grafana_folder: {{ $.Values.grafanaFolder }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
