{{- $name := include "microservice.name" . -}}
{{- $p := .Values.platform -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "microservice.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if .Values.persistence.enabled }}
    type: Recreate          # a ReadWriteOnce volume can be mounted by one node at a time
    {{- else }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # zero-downtime: a new pod must be Ready before an old one stops
    {{- end }}
  template:
    metadata:
      labels: {{- include "microservice.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "microservice.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.waitFor }}
      # Wait until the platform (PostgreSQL, RabbitMQ, ...) accepts TCP connections, so a
      # fresh install converges without CrashLoopBackOff while the StatefulSets start.
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              for target in {{ join " " . }}; do
                host="${target%:*}"; port="${target#*:}"
                until nc -z -w 2 "$host" "$port"; do echo "waiting for $target"; sleep 3; done
                echo "$target is up"
              done
          securityContext: {{- toYaml $.Values.securityContext | nindent 12 }}
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { cpu: 50m, memory: 32Mi }
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.port }}
          {{- if .Values.platformEnv }}
          envFrom:
            - configMapRef:
                name: {{ $p.configMapName }}
          {{- end }}
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: PORT
              value: {{ .Values.port | quote }}
            {{- if .Values.platformEnv }}
            {{- include "microservice.secretEnv" (dict "name" "INTERNAL_API_TOKEN" "secret" $p.secretName "key" "internal-api-token") | nindent 12 }}
            {{- include "microservice.secretEnv" (dict "name" "RABBITMQ_USER" "secret" $p.secretName "key" "rabbitmq-user") | nindent 12 }}
            {{- include "microservice.secretEnv" (dict "name" "RABBITMQ_PASSWORD" "secret" $p.secretName "key" "rabbitmq-password") | nindent 12 }}
            {{- include "microservice.secretEnv" (dict "name" "REDIS_PASSWORD" "secret" $p.secretName "key" "redis-password") | nindent 12 }}
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@{{ $p.rabbitmqHost }}:5672"
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@{{ $p.redisHost }}:6379"
            {{- end }}
            {{- if .Values.database }}
            {{- include "microservice.secretEnv" (dict "name" "DB_PASSWORD" "secret" $p.secretName "key" "service-db-password") | nindent 12 }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database }}_svc:$(DB_PASSWORD)@{{ $p.postgresHost }}:{{ $p.postgresPort }}/{{ .Values.database }}"
            {{- end }}
            {{- range .Values.secretEnv }}
            {{- include "microservice.secretEnv" (dict "name" .name "secret" $p.secretName "key" .key "optional" .optional) | nindent 12 }}
            {{- end }}
            {{- if and .Values.persistence.enabled .Values.persistence.envName }}
            - name: {{ .Values.persistence.envName }}
              value: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # startup -> liveness -> readiness: the three probe types from the module.
          startupProbe:
            httpGet: { path: {{ .Values.health.liveness }}, port: http }
            periodSeconds: 3
            failureThreshold: {{ .Values.health.startupFailureThreshold }}
          livenessProbe:
            httpGet: { path: {{ .Values.health.liveness }}, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: {{ .Values.health.readiness }}, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- end }}
