{{- $replicas := ternary .Values.autoscaling.minReplicas .Values.replicaCount .Values.autoscaling.enabled -}}
{{- if and .Values.podDisruptionBudget.enabled (gt (int $replicas) 1) }}
# Only rendered when the service runs 2+ replicas: a PDB with minAvailable 1 on a
# single replica would block `kubectl drain` forever.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "microservice.name" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "microservice.selectorLabels" . | nindent 6 }}
{{- end }}
