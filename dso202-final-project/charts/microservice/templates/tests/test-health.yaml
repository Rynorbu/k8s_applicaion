apiVersion: v1
kind: Pod
metadata:
  name: {{ include "microservice.name" . }}-test-health
  labels: {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: wget
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          wget -qO- http://{{ include "microservice.name" . }}:{{ .Values.port }}{{ .Values.health.readiness }}
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { cpu: 50m, memory: 32Mi }
